<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <style>
    /* System fonts — no external font loading */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #0f0f19;
      color: #e0e0e0;
      direction: rtl;
      padding: 0;
    }

    .popup-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(229,57,53,0.2), rgba(255,111,0,0.1));
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popup-header .icon { font-size: 22px; }

    .popup-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .popup-body { padding: 16px 20px; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .setting-row:last-child { border-bottom: none; }

    .setting-label {
      font-size: 14px;
      color: #ccc;
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      right: 3px;
      bottom: 3px;
      background: #666;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: rgba(229,57,53,0.4);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(-20px);
      background: #e53935;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    .popup-footer {
      padding: 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.04);
      text-align: center;
    }

    .status {
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf50;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <span class="icon">📰</span>
    <h1>חדשות בזמן אמת</h1>
  </div>

  <div class="popup-body">
    <div class="setting-row">
      <span class="setting-label">הצג וידג'ט</span>
      <label class="toggle">
        <input type="checkbox" id="toggleVisible" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="section-title">מקורות חדשות</div>

    <div class="setting-row">
      <span class="setting-label">🔴 צ'אט הכתבים N12</span>
      <label class="toggle">
        <input type="checkbox" id="toggleN12" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span class="setting-label">🔵 Ynet</span>
      <label class="toggle">
        <input type="checkbox" id="toggleYnet" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="popup-footer">
    <div class="status">
      <span class="status-dot"></span>
      <span id="statusText">מחובר | 0 עדכונים</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
